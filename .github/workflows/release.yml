name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/package.py
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -f "dist/weewx-rtldavis-${RELEASE_TAG#v}.zip"
      - name: Publish extension archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "dist/weewx-rtldavis-${RELEASE_TAG#v}.zip" --title "$RELEASE_TAG" --notes-file CHANGELOG.md
