name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        weewx: ['5.0.2', '5.5.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'weewx==${{ matrix.weewx }}'
      - run: python -m pytest -q
      - run: python tools/package.py
  receiver:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: receiver/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y librtlsdr-dev
      - run: go test -race ./...
        working-directory: receiver
      - run: go build -o ../dist/rtldavis .
        working-directory: receiver
